<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WineBOX.Clinic · Setup Turso</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f5f7fb; }
  h1 { color: #002045; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
  button { background: #17a589; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  button:hover { background: #11806a; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .log { background: #111; color: #0f0; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; margin-top: 16px; }
  .info { background: #e6f6f2; border-left: 4px solid #17a589; padding: 12px; border-radius: 4px; margin-bottom: 16px; }
  a { color: #1877f2; }
</style>
</head>
<body>
<h1>🧪 WineBOX.Clinic — Setup Turso</h1>

<div class="info">
  <strong>Instrucciones:</strong><br>
  1. Creá una cuenta gratis en <a href="https://turso.tech" target="_blank">turso.tech</a><br>
  2. Creá una base de datos y generá un <strong>Auth Token</strong><br>
  3. Completá los campos abajo y ejecutá el setup
</div>

<div class="card">
  <label for="dbUrl">Database URL</label>
  <input id="dbUrl" placeholder="https://tu-base.libsql.example.com">
</div>

<div class="card">
  <label for="authToken">Auth Token</label>
  <input id="authToken" type="password" placeholder="turso_xxxxx">
</div>

<button id="runBtn" onclick="runSetup()">🚀 Ejecutar Setup</button>
<button id="testBtn" onclick="testConnection()" style="background:#1877f2;margin-left:8px;">🔍 Probar Conexión</button>

<div id="log" class="log" style="display:none;"></div>

<script>
function log(msg) {
  var el = document.getElementById('log');
  el.style.display = 'block';
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function testConnection() {
  var url = document.getElementById('dbUrl').value.trim();
  var token = document.getElementById('authToken').value.trim();
  if (!url || !token) { log('❌ Completá ambos campos'); return; }

  log('🔍 Probando conexión...');
  fetch(url + '/v2/persist/query', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ sql: 'SELECT 1' })
  })
  .then(r => r.json())
  .then(d => {
    if (d.error) log('❌ Error: ' + d.error);
    else log('✅ Conexión exitosa! Base de datos: ' + url);
  })
  .catch(e => log('❌ Error de red: ' + e.message));
}

function runSetup() {
  var url = document.getElementById('dbUrl').value.trim();
  var token = document.getElementById('authToken').value.trim();
  if (!url || !token) { log('❌ Completá ambos campos'); return; }

  log('🚀 Iniciando setup de Turso...');
  log('📋 URL: ' + url);
  log('🔑 Token: ' + token.substring(0, 15) + '...');
  log('');

  // Inyectar config y ejecutar
  window.TURSO_CONFIG = { url: url, authToken: token };

  // Cargar seed
  var script = document.createElement('script');
  script.src = 'data.js';
  script.onload = function() {
    log('✅ Datos semilla cargados: ' + (window.WINEBOX_SEED?.users?.length || 0) + ' usuarios');

    // Ejecutar setup
    var s = document.createElement('script');
    s.src = 'turso-setup.js';
    s.onload = function() {
      log('✅ Setup completado!');
      log('');
      log('📍 Ahora abrí index.html y descomentá la línea TURSO_CONFIG');
      log('📍 Los datos se sincronizarán automáticamente.');
    };
    s.onerror = function() { log('❌ Error cargando turso-setup.js'); };
    document.head.appendChild(s);
  };
  script.onerror = function() { log('❌ Error cargando data.js'); };
  document.head.appendChild(script);
}
</script>
</body>
</html>
